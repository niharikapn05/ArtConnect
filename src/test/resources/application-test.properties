# In-memory H2 in PostgreSQL compatibility mode; Flyway runs the same migrations as production
spring.datasource.url=jdbc:h2:mem:artconnect;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
cloudinary.cloud_name=test
cloudinary.api_key=test
cloudinary.api_secret=test
# Tests close auctions explicitly
app.auctions.close-interval-ms=3600000
# Schema only; the tests create their own data
spring.flyway.locations=classpath:db/migration
app.payments.provider=mock
