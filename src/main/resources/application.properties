spring.application.name=ArtConnect

# Secrets come from environment variables, or from a local .env file (see .env.example)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/artconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches
spring.flyway.enabled=true
# db/sample loads demo users, artworks, bids, reviews and exhibitions into a fresh database.
# In production set FLYWAY_LOCATIONS=classpath:db/migration to leave it out.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/sample}
# Lets a database that already has the sample data keep starting after it is switched off
spring.flyway.ignore-migration-patterns=*:missing,*:future
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Payments: "mock" = demo mode, no real money (default, for local development)
#           "razorpay" = real payments; needs the Razorpay keys below (test keys start with rzp_test_)
app.payments.provider=${PAYMENT_PROVIDER:mock}
app.payments.currency=INR
# How long a buyer has to pay before a reserved artwork goes back on sale
app.payments.hold-minutes=30
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Invoices are emailed and texted to the contact details entered at checkout.
#   EMAIL_PROVIDER: "outbox" = demo, saves each email as an .html file in OUTBOX_DIR (default)
#                   "smtp"   = real email via the SMTP_* settings (Gmail app password, Brevo, Mailtrap...)
#   SMS_PROVIDER:   "outbox" = demo, appends each text to OUTBOX_DIR/sms.log (default)
#                   "twilio" = real SMS via the TWILIO_* settings (free trial: verified numbers only)
app.notifications.email.provider=${EMAIL_PROVIDER:outbox}
app.notifications.sms.provider=${SMS_PROVIDER:outbox}
app.notifications.outbox-dir=${OUTBOX_DIR:outbox}
app.notifications.email.from=${EMAIL_FROM:ArtConnect <no-reply@artconnect.local>}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}
# Twilio trial accounts can only send predefined templates: set e.g. sms_order_confirmation (leave empty once upgraded)
twilio.trial-template=${TWILIO_TRIAL_TEMPLATE:}
# Address of the website, used for "view invoice" links in emails and texts
app.public-url=${PUBLIC_URL:http://localhost:5173}
app.timezone=Asia/Kolkata

# Browser origins allowed to call the API directly (comma-separated; patterns like http://localhost:[*] allowed)
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:[*],http://127.0.0.1:[*]}
app.auth.token-validity-days=7

# The React build is served from classpath:/static by WebConfig (with SPA fallback)
spring.web.resources.add-mappings=false

server.port=${PORT:8081}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
